<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>MUUTOSKONE | PROGRESSIVE GOD MODE</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22[w3.org](http://www.w3.org/2000/svg%22) viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap)" rel="stylesheet">
    <style>
        :root {
            --bg: #06060a;
            --card: rgba(255, 255, 255, 0.03);
            --card-hover: rgba(255, 255, 255, 0.06);
            --input-bg: rgba(255, 255, 255, 0.05);
            --cyan: #00d4ff;
            --cyan-glow: rgba(0, 212, 255, 0.4);
            --purple: #8b5cf6;
            --purple-glow: rgba(139, 92, 246, 0.4);
            --pink: #ec4899;
            --pink-glow: rgba(236, 72, 153, 0.4);
            --grad: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 50%, #00d4ff 100%);
            --grad-reverse: linear-gradient(135deg, #00d4ff 0%, #8b5cf6 100%);
            --border: rgba(255, 255, 255, 0.06);
            --border-glow: rgba(255, 255, 255, 0.1);
            --text-dim: rgba(255, 255, 255, 0.4);
            --text-medium: rgba(255, 255, 255, 0.6);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            background-image: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(139, 92, 246, 0.15), transparent),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(0, 212, 255, 0.1), transparent);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 420px;
            width: 100%;
            padding: 20px;
        }

        /* LOGO */
        .logo-area {
            text-align: center;
            margin: 50px 0 45px;
            position: relative;
        }

        .logo-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 100px;
            background: radial-gradient(ellipse, var(--cyan-glow), transparent 70%);
            filter: blur(40px);
            pointer-events: none;
            opacity: 0.6;
        }

        .neon-logo {
            font-size: 2.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 1;
            margin: 0;
            position: relative;
            background: linear-gradient(135deg, #fff 0%, var(--cyan) 50%, var(--purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 30px var(--cyan-glow));
        }

        .sub-logo {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text-dim);
            margin-top: 12px;
            font-weight: 600;
        }

        /* GLASS CARDS */
        .glass-card {
            background: var(--card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        }

        .glass-card:hover {
            border-color: var(--border-glow);
            transform: translateY(-2px);
        }

        .setup-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .setup-label::before {
            content: '';
            width: 4px;
            height: 4px;
            background: var(--cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--cyan);
        }

        .setup-indent {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .xp-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--input-bg);
            border-radius: 16px;
            padding: 6px 16px;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .xp-row:focus-within {
            border-color: var(--cyan);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.1);
        }

        .xp-tag {
            font-weight: 800;
            font-size: 12px;
            min-width: 50px;
            padding: 6px 0;
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        input, select {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 15px;
            padding: 12px 0;
            outline: none;
            font-family: inherit;
            width: 100%;
            font-weight: 500;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        select {
            cursor: pointer;
            background: var(--input-bg);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border);
        }

        select option {
            background: #1a1a24;
            color: #fff;
        }

        /* STATUS BOX */
        .status-box {
            background: linear-gradient(180deg, rgba(139, 92, 246, 0.08) 0%, rgba(0, 212, 255, 0.05) 100%);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 32px 28px;
            border: 1px solid var(--border);
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .status-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(139, 92, 246, 0.05), transparent 30%);
            animation: rotate 20s linear infinite;
            pointer-events: none;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        .status-content {
            position: relative;
            z-index: 1;
        }

        .m-val {
            font-size: 88px;
            font-weight: 900;
            line-height: 0.85;
            letter-spacing: -5px;
            margin: 12px 0 8px;
            background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 4px 30px rgba(255,255,255,0.1));
        }

        .m-lbl {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-dim);
            letter-spacing: 3px;
            font-weight: 700;
        }

        .level-section {
            text-align: left;
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .level-display {
            font-size: 28px;
            font-weight: 900;
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
        }

        .bar-container {
            position: relative;
        }

        .bar-bg {
            height: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            background: var(--grad);
            border-radius: 20px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 0 20px var(--cyan-glow);
        }

        .bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-dim);
            margin-top: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stats-row span:first-child { color: var(--cyan); }

        /* BONUS BADGE */
        .bonus-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: linear-gradient(135deg, var(--pink), var(--purple));
            color: white;
            padding: 8px 14px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px var(--pink-glow);
            z-index: 2;
        }

        /* TASK BUTTONS */
        .task-btn {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 20px 24px;
            border-radius: 20px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .task-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--grad);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .task-btn:hover {
            transform: scale(1.02);
            border-color: var(--border-glow);
        }

        .task-btn:hover::before {
            opacity: 0.05;
        }

        .task-btn:active {
            transform: scale(0.98);
        }

        .task-btn span {
            position: relative;
            z-index: 1;
        }

        .task-btn .task-name {
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .task-btn .task-xp {
            font-weight: 800;
            font-size: 14px;
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .task-btn .task-xp.highlight {
            background: linear-gradient(135deg, var(--pink), #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* BUTTONS */
        .btn-main {
            background: var(--grad);
            color: #000;
            border: none;
            padding: 20px;
            border-radius: 20px;
            width: 100%;
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-main::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #fff, transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px var(--cyan-glow);
        }

        .btn-main:hover::before {
            opacity: 0.2;
        }

        .btn-main:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text-medium);
            padding: 18px;
            border-radius: 18px;
            width: 100%;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 12px;
        }

        .btn-secondary:hover {
            border-color: var(--border-glow);
            color: #fff;
        }

        .btn-sub {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 14px;
            border-radius: 14px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .btn-sub:hover {
            border-color: var(--border-glow);
            color: var(--text-medium);
        }

        .btn-danger {
            border-color: rgba(239, 68, 68, 0.2);
            color: rgba(239, 68, 68, 0.5);
        }

        .btn-danger:hover {
            border-color: rgba(239, 68, 68, 0.4);
            color: rgba(239, 68, 68, 0.8);
        }

        /* HEADER INFO */
        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 16px;
            padding: 0 4px;
        }

        .header-info span {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header-info .goal {
            color: var(--cyan);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-info .goal::before {
            content: '◆';
            font-size: 6px;
        }

        .header-info .target {
            color: var(--text-dim);
        }

        /* POPUPS */
        #lvlOverlay, #victoryOverlay {
            position: fixed;
            inset: 0;
            z-index: 5000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(6, 6, 10, 0.9);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            text-align: center;
            padding: 20px;
        }

        .popup-content {
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .popup-label {
            letter-spacing: 8px;
            color: var(--cyan);
            font-weight: 800;
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .popup-title {
            font-size: 3.5rem;
            font-weight: 900;
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            filter: drop-shadow(0 0 40px var(--purple-glow));
        }

        .popup-level {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            margin: 16px 0 40px;
        }

        .victory-title {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #22c55e, #84cc16, #eab308);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 40px rgba(34, 197, 94, 0.5));
            margin: 0;
        }

        .victory-sub {
            font-size: 16px;
            color: var(--cyan);
            margin: 16px 0 50px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .btn-popup {
            background: var(--grad);
            color: #000;
            border: none;
            padding: 18px 48px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-popup:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 40px var(--cyan-glow);
        }

        .btn-victory {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }

        .btn-victory:hover {
            box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4);
        }

        /* XP FLY */
        .xp-fly {
            position: absolute;
            font-weight: 900;
            font-size: 24px;
            pointer-events: none;
            animation: fly 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            z-index: 7000;
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 10px var(--cyan-glow));
        }

        @keyframes fly {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120px) scale(1.2); opacity: 0; }
        }

        /* FOOTER */
        .footer-actions {
            margin-top: 50px;
            display: flex;
            gap: 10px;
        }

        .footer-actions .btn-sub {
            flex: 1;
        }
    </style>
</head>
<body>

<div id="lvlOverlay">
    <div class="popup-content">
        <p class="popup-label">LEVEL UP!</p>
        <h1 class="popup-title">TASO NOUSI!</h1>
        <h2 class="popup-level" id="popLvlText">LEVEL 2</h2>
        <button class="btn-popup" onclick="closeLvl()">JATKA PELIÄ ⚔️</button>
    </div>
</div>

<div id="victoryOverlay">
    <div class="popup-content">
        <h1 class="victory-title">VOITTO! 🎉</h1>
        <p class="victory-sub">Tavoite saavutettu</p>
        <button class="btn-popup btn-victory" onclick="reset()">ALOITA UUSI PELI</button>
    </div>
</div>

<div class="container">
    <div id="viewSetup">
        <div class="logo-area">
            <div class="logo-glow"></div>
            <h1 class="neon-logo">MUUTOSKONE</h1>
            <div class="sub-logo">Strateginen analyysityökalu</div>
        </div>

        <div class="glass-card">
            <label class="setup-label">Mikä on tavoitteesi?</label>
            <div class="xp-row" style="padding: 4px 16px;">
                <input type="text" id="inGoal" placeholder="esim. Kesäkuntoon">
            </div>
        </div>

        <div class="glass-card">
            <label class="setup-label">Määritä rutiinit</label>
            <div class="setup-indent">
                <div class="xp-row"><span class="xp-tag">10 XP</span><input type="text" id="inR10" placeholder="Vesi, vitamiinit..."></div>
                <div class="xp-row"><span class="xp-tag">20 XP</span><input type="text" id="inR20" placeholder="Kävely, proteiini..."></div>
                <div class="xp-row"><span class="xp-tag">40 XP</span><input type="text" id="inR40" placeholder="Treeni, juoksu..."></div>
            </div>
        </div>

        <div class="glass-card">
            <label class="setup-label">Vaikeusaste</label>
            <select id="inV">
                <option value="1000">Uusi rutiini (1 000 XP)</option>
                <option value="5000" selected>Merkittävä muutos (5 000 XP)</option>
                <option value="10000">Elämänmuutos (10 000 XP)</option>
                <option value="100000">GOD MODE (100 000 XP)</option>
            </select>
        </div>

        <button class="btn-main" onclick="start()">KÄYNNISTÄ KONE ⚡</button>
        <button class="btn-secondary" onclick="document.getElementById('fileIn').click()">📁 Tuo vanha edistys</button>
        <input type="file" id="fileIn" style="display:none" onchange="importData(event)">
    </div>

    <div id="viewGame" style="display:none;">
        <div class="header-info">
            <span class="goal" id="txtGoal"></span>
            <span class="target" id="txtV"></span>
        </div>

        <div class="status-box">
            <div id="bonusBadge" class="bonus-badge">×1.00</div>
            <div class="status-content">
                <div class="m-lbl">Päiviä maaliin</div>
                <div class="m-val" id="valM">--</div>

                <div class="level-section">
                    <div class="level-display" id="valLvl">LEVEL 1</div>
                    <div class="bar-container">
                        <div class="bar-bg"><div class="bar-fill" id="barXP"></div></div>
                    </div>
                    <div class="stats-row">
                        <span>XP: <span id="valTotal">0</span></span>
                        <span>PÄIVÄ <span id="valDays">1</span></span>
                    </div>
                </div>
            </div>
        </div>

        <div id="taskList"></div>

        <button class="btn-secondary" onclick="nextDay()">☀️ Seuraava päivä</button>

        <div class="footer-actions">
            <button class="btn-sub" onclick="exportData()">💾 Varmuuskopio</button>
            <button class="btn-sub btn-danger" onclick="reset()">🗑️ Nollaa</button>
        </div>
    </div>
</div>

<script>
    let g = { active: false, goal: "", r10: "", r20: "", r40: "", v: 5000, total: 0, daily: 0, days: 1, lvl: 1 };

    window.onload = () => {
        const saved = localStorage.getItem('mk_god_v3');
        if (saved) { g = JSON.parse(saved); if (g.active) render(); }
    };

    function start() {
        g.goal = document.getElementById('inGoal').value || "Muutos";
        g.r10 = document.getElementById('inR10').value || "Pienet teot";
        g.r20 = document.getElementById('inR20').value || "Keskisuuret teot";
        g.r40 = document.getElementById('inR40').value || "Isot teot";
        g.v = parseInt(document.getElementById('inV').value);
        g.active = true; save(); render();
    }

    function render() {
        document.getElementById('viewSetup').style.display = 'none';
        document.getElementById('viewGame').style.display = 'block';
        document.getElementById('txtGoal').innerText = g.goal;
        document.getElementById('txtV').innerText = `${g.v.toLocaleString('fi-FI')} XP`;
        updateUI();
    }

    function getMultiplier() {
        return 1 + (Math.min(g.days, 84) - 1) * (1 / 83);
    }

    function addXP(baseAmt, e) {
        let multi = getMultiplier();
        let finalAmt = Math.round(baseAmt * multi);
        g.total += finalAmt; g.daily += finalAmt;

        const pop = document.createElement('div');
        pop.className = 'xp-fly'; pop.innerText = `+${finalAmt}`;
        pop.style.left = `${e.pageX - 20}px`; pop.style.top = `${e.pageY - 20}px`;
        document.body.appendChild(pop); setTimeout(() => pop.remove(), 800);

        let newLvl = Math.floor(g.total / 200) + 1;
        if (newLvl > g.lvl) { g.lvl = newLvl; showPop(); }
        if (g.total >= g.v) document.getElementById('victoryOverlay').style.display = 'flex';
        save(); updateUI();
    }

    function updateUI() {
        let multi = getMultiplier();
        document.getElementById('bonusBadge').innerText = `×${multi.toFixed(2)}`;
        document.getElementById('valDays').innerText = g.days;

        const curXP = g.total % 200;
        document.getElementById('barXP').style.width = `${(curXP / 200) * 100}%`;
        document.getElementById('valTotal').innerText = g.total.toLocaleString('fi-FI');
        document.getElementById('valLvl').innerText = `LEVEL ${g.lvl}`;

        let avg = g.total / g.days;
        if (avg > 0 && g.total < g.v) document.getElementById('valM').innerText = Math.ceil((g.v - g.total) / avg);
        else document.getElementById('valM').innerText = g.total >= g.v ? "0" : "--";

        document.getElementById('taskList').innerHTML = `
            <div class="task-btn" onclick="addXP(10, event)">
                <span class="task-name">💧 ${g.r10}</span>
                <span class="task-xp">+${Math.round(10*multi)}</span>
            </div>
            <div class="task-btn" onclick="addXP(20, event)">
                <span class="task-name">🏃 ${g.r20}</span>
                <span class="task-xp">+${Math.round(20*multi)}</span>
            </div>
            <div class="task-btn" onclick="addXP(40, event)">
                <span class="task-name">🔥 ${g.r40}</span>
                <span class="task-xp highlight">+${Math.round(40*multi)}</span>
            </div>
        `;
    }

    function nextDay() { g.daily = 0; g.days++; save(); updateUI(); window.scrollTo(0,0); }
    function save() { localStorage.setItem('mk_god_v3', JSON.stringify(g)); }
    function showPop() { document.getElementById('popLvlText').innerText = `LEVEL ${g.lvl}`; document.getElementById('lvlOverlay').style.display = 'flex'; }
    function closeLvl() { document.getElementById('lvlOverlay').style.display = 'none'; }
    function reset() { if(confirm("Haluatko varmasti nollata kaiken edistyksen?")) { localStorage.clear(); location.reload(); } }
    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(g));
        const dl = document.createElement('a'); dl.setAttribute("href", dataStr); dl.setAttribute("download", "muutoskone_backup.json"); dl.click();
    }
    function importData(event) {
        const reader = new FileReader();
        reader.onload = (e) => { g = JSON.parse(e.target.result); save(); render(); };
        reader.readAsText(event.target.files[0]);
    }
</script>

</body>
</html>
